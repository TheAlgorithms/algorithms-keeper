[project]
name = "algorithms-keeper"
version = "0.1.0"
description = "A GitHub bot for TheAlgorithms/Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp==3.14.3",
  "cachetools==7.1.8",
  "fixit==2.2.1",
  "gidgethub==5.4.0",
  "libcst==1.9.0",
  "sentry-sdk==2.68.1",
]

[dependency-groups]
dev = [
  "pre-commit",
  "pytest==9.1.1",
  "pytest-aiohttp==1.1.1",
  "pytest-asyncio==1.4.0",
  "ty==0.0.78",
]

[tool.uv]
package = false

[tool.ty.src]
include = ["algorithms_keeper", "tests"]
# Parser fixtures intentionally omit required annotations.
exclude = ["tests/data"]

[tool.ty.terminal]
error-on-warning = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
future-annotations = true
select = [
  "A",      # flake8-builtins
  "AIR",    # Airflow
  "ASYNC",  # flake8-async
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "C90",    # McCabe cyclomatic complexity
  "DJ",     # flake8-django
  "DTZ",    # flake8-datetimez
  "E",      # pycodestyle
  "EM",     # flake8-errmsg
  "EXE",    # flake8-executable
  "F",      # Pyflakes
  "FLY",    # flynt
  "G",      # flake8-logging-format
  "I",      # isort
  "ICN",    # flake8-import-conventions
  "INP",    # flake8-no-pep420
  "INT",    # flake8-gettext
  "ISC",    # flake8-implicit-str-concat
  "N",      # pep8-naming
  "NPY",    # NumPy-specific rules
  "PD",     # pandas-vet
  "PERF",   # Perflint
  "PGH",    # pygrep-hooks
  "PIE",    # flake8-pie
  "PL",     # Pylint
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "RSE",    # flake8-raise
  "RUF",    # Ruff-specific rules
  "S",      # flake8-bandit
  "SIM",    # flake8-simplify
  "SLF",    # flake8-self
  "SLOT",   # flake8-slots
  "T10",    # flake8-debugger
  "TC",     # flake8-type-checking
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # pycodestyle
  "YTT",    # flake8-2020
  # "ANN",  # flake8-annotations
  # "ARG",  # flake8-unused-arguments
  # "COM",  # flake8-commas
  # "CPY",  # flake8-copyright (no per-file copyright notices)
  # "D",    # pydocstyle
  # "ERA",  # eradicate
  # "FA",   # flake8-future-annotations
  # "FBT",  # flake8-boolean-trap
  # "FIX",  # flake8-fixme
  # "Q",    # flake8-quotes
  # "RET",  # flake8-return
  # "T20",  # flake8-print
  # "TD",   # flake8-todos
  # "TRY",  # tryceratops
]
ignore = ["E111", "E114", "E117", "N802", "PGH003", "RUF012", "SLF001", "W191"]

[tool.ruff.lint.mccabe]
max-complexity = 13

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT006", "PT007", "S101"]
"tests/test_commands.py" = ["B008"]
"tests/test_pull_requests.py" = ["B008"]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["bytes", "int", "str"]
max-args = 6  # Recommended: 5

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = "tests"
